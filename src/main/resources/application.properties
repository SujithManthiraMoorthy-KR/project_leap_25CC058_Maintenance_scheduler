spring.application.name=maintenance-scheduler

# Database Configuration (H2 in-memory DB by default for zero-setup execution, switchable to MySQL)
spring.datasource.url=jdbc:h2:mem:maintenancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment below if using local MySQL server)
# spring.datasource.url=jdbc:mysql://localhost:3306/maintenance_scheduler
# spring.datasource.username=root
# spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080